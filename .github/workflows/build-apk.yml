name: Build HiAssist APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list ("tools platform-tools")
          # includes the legacy standalone "tools" package, which Google
          # has removed from its SDK repository; requesting it now fails
          # the whole step. We only need platform-tools here (platforms
          # and build-tools are installed explicitly in the next step).
          packages: "platform-tools"

      - name: Install Android 35 SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build arm64 debug APK with embedded SraVaani
        run: gradle --no-daemon :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Android Lint
        run: gradle --no-daemon :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify SraVaani ONNX model feature dimension
        run: |
          python3 -m pip install --quiet onnx
          python3 - <<'PYEOF'
          import onnx

          model = onnx.load("app/src/main/assets/sravaani/model-la13.onnx")

          def shape_of(value_info):
              dims = []
              for d in value_info.type.tensor_type.shape.dim:
                  dims.append(d.dim_value if d.dim_value else (d.dim_param or "?"))
              return dims

          print("== ONNX graph inputs (name: shape) ==")
          for inp in model.graph.input:
              print(f"{inp.name}: {shape_of(inp)}")

          print("== ONNX graph outputs (name: shape) ==")
          for out in model.graph.output:
              print(f"{out.name}: {shape_of(out)}")

          # The audio/feature input for a NeMo-style streaming CTC ONNX export
          # carries one fixed (non-batch, non-time) dimension: the feature bin
          # count. Report every candidate so the value baked into
          # SravaaniSttEngine.FEATURE_DIM (currently 80) can be checked by
          # eye against the model actually shipped in this build.
          print("== Candidate feature dimensions (fixed dims other than 1) ==")
          for inp in model.graph.input:
              for d in shape_of(inp):
                  if isinstance(d, int) and d not in (1,) and d < 2000:
                      print(f"{inp.name} has a fixed dimension: {d}")
          PYEOF

      - name: Verify embedded model and APK
        run: |
          test -f app/src/main/assets/sravaani/model-la13.onnx
          test "$(stat -c%s app/src/main/assets/sravaani/model-la13.onnx)" = "658699885"
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Inspect APK contents, size, and SHA-256
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "== APK exact size (bytes) =="
          stat -c%s "$APK"
          echo "== APK SHA-256 =="
          sha256sum "$APK"
          echo "== assets/sravaani/* entries in APK =="
          unzip -l "$APK" | grep -i sravaani
          echo "== arm64-v8a native libs in APK =="
          unzip -l "$APK" | grep -i "lib/arm64-v8a"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GiVa-HiAssist-1.0-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 14
