name: Build HiAssist APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build arm64 debug APK with embedded SraVaani
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify embedded model and APK
        run: |
          test -f app/src/main/assets/sravaani/model-la13.onnx
          test "$(stat -c%s app/src/main/assets/sravaani/model-la13.onnx)" = "658699885"
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GiVa-HiAssist-1.0-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 14
