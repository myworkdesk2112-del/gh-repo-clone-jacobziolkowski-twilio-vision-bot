name: Build HiAssist APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build arm64 debug APK with embedded SraVaani
        run: gradle --no-daemon :app:assembleDebug

      - name: Run Android Lint
        run: gradle --no-daemon :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify embedded model and APK
        run: |
          test -f app/src/main/assets/sravaani/model-la13.onnx
          test "$(stat -c%s app/src/main/assets/sravaani/model-la13.onnx)" = "658699885"
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Inspect APK contents, size, and SHA-256
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "== APK exact size (bytes) =="
          stat -c%s "$APK"
          echo "== APK SHA-256 =="
          sha256sum "$APK"
          echo "== assets/sravaani/* entries in APK =="
          unzip -l "$APK" | grep -i sravaani
          echo "== arm64-v8a native libs in APK =="
          unzip -l "$APK" | grep -i "lib/arm64-v8a"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GiVa-HiAssist-1.0-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 14
